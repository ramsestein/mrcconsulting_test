# Página «Contacto» con el formulario.
# Plantilla: site/templates/contact.php · Lógica: site/controllers/contact.php
# El correo que recibe los mensajes se cambia en Ajustes del sitio → Formulario.
title: Contacto
icon: email

options:
  delete: false
  changeTemplate: false
  duplicate: false

tabs:
  content:
    label: Contenido
    icon: text
    columns:
      main:
        width: 2/3
        fields:
          lead:
            label: Subtítulo de la página
            type: textarea
            buttons: false
          intro:
            extends: fields/writer
            label: Texto junto al formulario
      sidebar:
        width: 1/3
        fields:
          success:
            label: Mensaje tras enviar (opcional)
            type: textarea
            buttons: false
            help: Si se deja vacío, se usa el texto estándar.

  form:
    label: Formulario
    icon: list-bullet
    fields:
      formInfo:
        type: info
        theme: info
        text: Aquí se definen las opciones de los desplegables del formulario. El destinatario de los mensajes se cambia en «Ajustes del sitio» → «Formulario».
      topics:
        label: Temas («¿En qué necesitas ayuda?»)
        type: structure
        help: La «clave» no debe cambiarse si hay botones que la usan (es igual en todos los idiomas).
        columns:
          label: true
          key: true
        fields:
          label:
            label: Texto
            type: text
            required: true
            width: 2/3
          key:
            label: Clave
            type: slug
            required: true
            width: 1/3
      orgTypes:
        label: Tipos de organización
        type: tags
        help: Escribe cada opción y pulsa Intro.
      studyTypes:
        label: Tipos de estudio
        type: tags
      stages:
        label: Fases del proyecto
        type: tags

  seo: tabs/seo
