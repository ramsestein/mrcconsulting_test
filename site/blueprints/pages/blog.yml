# Página «Blog»: lista las entradas, de la más nueva a la más antigua.
# Plantilla: site/templates/blog.php
title: Blog
icon: book

options:
  delete: false
  changeTemplate: false

tabs:
  content:
    label: Entradas
    icon: book
    columns:
      main:
        width: 2/3
        sections:
          drafts:
            label: Borradores
            type: pages
            status: draft
            template: post
            layout: list
            empty: No hay borradores
          published:
            label: Publicadas
            type: pages
            status: listed
            template: post
            layout: list
            sortBy: date desc
            info: "{{ page.date.toDate('dd/MM/yyyy') }}"
            empty: Todavía no hay entradas publicadas
      sidebar:
        width: 1/3
        fields:
          lead:
            label: Texto de presentación del blog
            type: textarea
            buttons: false
          perPage:
            label: Entradas por página
            type: number
            default: 9
            min: 3
            max: 30
  seo: tabs/seo
