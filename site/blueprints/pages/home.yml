# Página de inicio. Igual que una página estándar, pero no se puede
# borrar ni cambiar de dirección. Plantilla: site/templates/home.php
title: Inicio
icon: home

options:
  delete: false
  changeSlug: false
  changeStatus: false
  changeTemplate: false
  duplicate: false

tabs:
  content:
    label: Contenido
    icon: text
    columns:
      main:
        width: 3/4
        fields:
          blocks: fields/blocks
      sidebar:
        width: 1/4
        sections:
          images:
            label: Imágenes de esta página
            type: files
            layout: cards
            template: image
            info: "{{ file.dimensions }}"
  seo: tabs/seo
